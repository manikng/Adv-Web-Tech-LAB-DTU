<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adv Web Tech Lab</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <a class="logo" href="./" aria-label="AWT Lab home">
            <span class="logo-mark">AWT</span>
            <span>Laboratory</span>
        </a>
        <nav aria-label="Primary navigation">
            <span class="author-label">
                <strong>Manish Singh</strong>
                <span>23/CS/244</span>
            </span>
            <button id="home-btn" class="nav-link active" type="button">All Experiments</button>
        </nav>
    </header>

    <main id="app-content"></main>

    <footer class="site-footer" id="contact">
        <div class="footer-intro">
            <p class="footer-eyebrow">Get in touch</p>
            <h2>Let’s connect.</h2>
            <p>Have feedback about a project or want to discuss web technologies?</p>
        </div>

        <form class="contact-form" id="contact-form">
            <div class="form-row">
                <label for="contact-name">Name</label>
                <input id="contact-name" name="name" type="text" autocomplete="name" placeholder="Your name" required>
            </div>
            <div class="form-row">
                <label for="contact-email">Email</label>
                <input id="contact-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            </div>
            <div class="form-row form-row-full">
                <label for="contact-message">Message</label>
                <textarea id="contact-message" name="message" rows="4" placeholder="Write your message" required></textarea>
            </div>
            <div class="form-actions">
                <button class="submit-button" type="submit">Send Message</button>
                <p class="form-status" id="form-status" role="status"></p>
            </div>
        </form>

        <div class="footer-bottom">
            <p>© 2026 Manish Singh</p>
            <a href="mailto:manisskng@gmail.com">manisskng@gmail.com</a>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
